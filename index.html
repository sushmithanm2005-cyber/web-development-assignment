<!DOCTYPE html>
<html>
<head>
<style>

.card{
    width:250px;
    border:1px solid gray;
    padding:15px;
    text-align:center;
    border-radius:8px;
}

.card img{
    width:100%;
    border-radius:5px;
}

h3{
    color:#7a1f2b;
}

button{
    background-color:#7a1f2b;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background-color:#5e1620;
}

</style>
</head>

<body>

<div class="card">

<img src="school.jpg" alt="School Event">

<h3>School Event</h3>

<p>Annual cultural event conducted for students.</p>

<button>Get More Info</button>

</div>

</body>
</html>
